# The environment that produced the paper's numbers (macOS arm64, 11 to 13 October 2026).
name: satsdoh
channels:
  - conda-forge
dependencies:
  - python=3.11.13
  - numpy=2.2.6
  - pandas=2.2.3
  - scipy=1.16.1
  - scikit-learn=1.7.1
  - xgboost=3.0.2
  - shap=0.48.0
  - pyarrow=21.0.0
  - matplotlib=3.10.5
  - joblib=1.3.2
  - catboost=1.2.8
  - pip
