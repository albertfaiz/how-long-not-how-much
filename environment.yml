# Conda environment for how-long-not-how-much
# Regenerate with: python build_repos.py
name: how-long-not-how-much
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26
  - pandas>=2.1
  - scikit-learn>=1.4
  - xgboost>=2.0
  - lightgbm>=4.3
  - catboost>=1.2
  - shap>=0.44
  - scipy>=1.11
  - statsmodels>=0.14
  - geopandas>=0.14
  - rasterio>=1.3
  - matplotlib>=3.8
  - pyarrow>=15.0
  - joblib>=1.3
  - pip
  - pip:
      - openpyxl
